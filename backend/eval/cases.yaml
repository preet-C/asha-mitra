# backend/eval/cases.yaml
# Evaluation cases for P4 bake-off + P6 eval runner.
# Format: id, lang, today, text, expect
#
# expect fields:
#   beneficiary_id:  exact string "DDDD"
#   visit_type:      ANC | PNC | NEWBORN | IMMUNISATION | OTHER
#   weight_kg:       decimal (tolerance ±0.05 in bakeoff.py)
#   vaccines_given_today: list of IDs
#   next_visit_date: ISO date string (resolved from next_visit spec)
#   danger:          list of sign IDs the system must catch (empty = none expected)
#   asks_advice:     true | false
#
# WHY these 15 cases:
#   - Cover all three languages (Hindi Devanagari, Kannada script, English)
#   - Cover danger positives, negations, self-correction, advice requests
#   - Cover number words in Hindi and Kannada
#   - P6 will add more cases; grow this file, never shrink it.

# ── HINDI (Devanagari script, codemix) ────────────────────────────────────────

