# templates.yaml
# All agent speech templates. Used by speak() in backend/app/brain/speak.py.
#
# STRUCTURE:
#   tier: A  = safety lines. NEVER generated by LLM. NEVER changed without human review.
#   tier: B  = conversational lines. LLM MAY generate wording (only if P13 gate passes).
#   verified: true  = native speaker has checked this language.
#   verified: false = DRAFT. Must be checked before claiming verified.
#
# TIER A KEYS: disclosure, refer_phc, cannot_advise, readback, readback_changed, saved
# TIER B KEYS: everything else
#
# PLACEHOLDER DICTIONARY (all templates must use EXACTLY these names):
#   {id}           - beneficiary ID string e.g. "1042"
#   {name}         - beneficiary name e.g. "Sunita Devi"
#   {visit_type}   - visit type label (from visit_type_labels below) e.g. "newborn visit"
#   {weight}       - weight rendered by render_number() e.g. "two kilo eight hundred gram"
#   {last_weight}  - previous weight, same rendering
#   {new_weight}   - newly stated weight, same rendering
#   {date}         - date rendered by date_to_words() e.g. "fifteen December"
#   {vaccine}      - vaccine spoken label e.g. "Penta one" (from vaccine_schedule.json spoken field)
#   {expected}     - expected vaccine spoken label
#   {vaccines_given} - comma-joined spoken vaccine labels e.g. "Penta one, OPV one"
#   {vaccines_due}   - comma-joined due vaccine labels
#   {sign}         - single danger sign label in worker's language (from danger_signs.yaml labels)
#   {signs}        - comma-joined danger sign labels
#   {fields}       - comma-joined field display names (from field_labels below)
#   {language}     - language name e.g. "Hindi"
#   {summary}      - full readback summary (brain builds this string from locked facts)
#
# RULE: speak() fills placeholders. Brain must always provide every placeholder
#       that appears in the template. Missing placeholder = template rendering error.

# ═══════════════════════════════════════════════════════════════════════════════
# TIER A — LOCKED SAFETY LINES
# These are the most critical lines. Never generate. One string per language only.
# ═══════════════════════════════════════════════════════════════════════════════

disclosure:
  tier: A
  verified: true   # TODO: native speaker must verify hi-IN and kn-IN before event
  en-IN: "Hello. I am an AI assistant. I help you record this home visit. I can make mistakes, so please check what I read back."
  hi-IN: "नमस्ते। मैं एक एआई सहायक हूँ। मैं इस होम विज़िट का रिकॉर्ड बनाने में आपकी मदद करती हूँ। मुझसे गलती हो सकती है, इसलिए जो मैं दोहराऊँ उसे ज़रूर जाँचिए।"
  kn-IN: "ನಮಸ್ಕಾರ. ನಾನು ಎಐ ಸಹಾಯಕಿ. ಈ ಮನೆ ಭೇಟಿಯ ದಾಖಲೆ ಮಾಡಲು ನಾನು ನಿಮಗೆ ಸಹಾಯ ಮಾಡುತ್ತೇನೆ. ನನ್ನಿಂದ ತಪ್ಪಾಗಬಹುದು, ಆದ್ದರಿಂದ ನಾನು ಓದಿ ಹೇಳುವುದನ್ನು ದಯವಿಟ್ಟು ಪರಿಶೀಲಿಸಿ."

refer_phc:
  tier: A
  verified: true   # TODO: native speaker must verify hi-IN and kn-IN before event
  en-IN: "Danger sign: {signs}. Please refer to the PHC immediately."
  hi-IN: "खतरे का संकेत: {signs}। अभी पीएचसी रेफर करें।"
  kn-IN: "ಅಪಾಯದ ಲಕ್ಷಣ: {signs}. ಈಗಲೇ ಪಿಎಚ್‌ಸಿಗೆ ರೆಫರ್ ಮಾಡಿ."

cannot_advise:
  tier: A
  verified: true   # TODO: native speaker must verify hi-IN and kn-IN before event
  en-IN: "I cannot give medicine or treatment advice. Please contact your ANM or the PHC doctor."
  hi-IN: "मैं दवा या इलाज की सलाह नहीं दे सकती। कृपया अपनी एएनएम या पीएचसी डॉक्टर से संपर्क करें।"
  kn-IN: "ನಾನು ಔಷಧಿ ಅಥವಾ ಚಿಕಿತ್ಸೆಯ ಸಲಹೆ ನೀಡಲು ಸಾಧ್ಯವಿಲ್ಲ. ದಯವಿಟ್ಟು ನಿಮ್ಮ ಎಎನ್‌ಎಂ ಅಥವಾ ಪಿಎಚ್‌ಸಿ ವೈದ್ಯರನ್ನು ಸಂಪರ್ಕಿಸಿ."

# readback: spoken after extraction. {summary} is fully built by brain from locked facts.
# Brain renders each fact using render_number / date_to_words / vaccine labels.
# Brain omits fields that are null (not_mentioned).
readback:
  tier: A
  verified: true   # Checked by user 2026-11-21
  en-IN: "Let me read back. {summary} Is this correct?"
  hi-IN: "मैं दोहराती हूँ। {summary} क्या यह सही है?"
  kn-IN: "ನಾನು ಓದಿ ಹೇಳುತ್ತೇನೆ. {summary} ಇದು ಸರಿಯೇ?"

# readback_changed: spoken after a correction. Brain builds {summary} with changed field only.
readback_changed:
  tier: A
  verified: true   # Checked by user 2026-11-21
  en-IN: "Changed. {summary} Is that correct now?"
  hi-IN: "बदल दिया। {summary} अब सही है?"
  kn-IN: "ಬದಲಾಯಿಸಿದೆ. {summary} ಈಗ ಸರಿಯೇ?"

saved:
  tier: A
  verified: true   # Checked by user 2026-11-21
  en-IN: "Visit saved. ID {id}, {name}."
  hi-IN: "विज़िट सेव हो गया। आईडी {id}, {name}।"
  kn-IN: "ಭೇಟಿ ಉಳಿಸಲಾಗಿದೆ. ಐಡಿ {id}, {name}."

# ═══════════════════════════════════════════════════════════════════════════════
# TIER B — CONVERSATIONAL LINES (1-3 variants, random pick, never same twice in row)
