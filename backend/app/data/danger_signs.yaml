# danger_signs.yaml
# Closed list of danger signs the agent monitors.
# Source: official MoHFW / NHM documents (see docs/guideline_sources.md for URLs + pages).
#
# RULES (from AGENTS.md):
#   - Never add a sign that is not in this file.
#   - Each sign needs: id, applies_to, labels (en/hi/kn), keywords (en/hi/kn), source.
#   - `applies_to`: NEWBORN | MOTHER | BOTH
#   - Keyword lists: used by danger.py keyword net (backup to LLM).
#     Aim for 8-12 per sign per language. Include code-mixed variants.
#   - Labels are spoken aloud in refer_phc template. Human verifies hi/kn labels.
#
# TODO for team before event:
#   1. Open each source PDF (URLs in docs/guideline_sources.md).
#   2. Find the exact page number and update source: field below.
#   3. Native speaker: verify every hi and kn label field.
#   4. Check SSBSK 2026 PDF — does it add or change any sign? If yes, add it.

