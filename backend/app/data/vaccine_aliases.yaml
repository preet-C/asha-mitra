# vaccine_aliases.yaml
# Small lookup table: vaccine spoken aliases per language.
# WHY: grounding.py needs to check whether the ASHA worker mentioned a vaccine
#      by any of its local names. This is data-only — no medical content.
#
# Format: each vaccine ID maps to lists of alias strings per language (en/hi/kn).
# Matching is case-insensitive substring in the normalised transcript.
# Source: common spoken names heard from ASHA workers + vaccine labels in
#         vaccine_schedule.json "spoken" field.
#
# RULES:
#   - Only en/hi/kn names. No Tier 2 languages here.
#   - No medical content, dosage, or clinical instructions.
#   - New vaccine IDs must already be in vaccine_schedule.json.

