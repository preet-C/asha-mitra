# number_words.yaml
# Hand-crafted number word tables for Hindi and Kannada.
# WHY: num2words has no Hindi support. Kannada output has joining errors.
# Used by: render_number() in backend/app/brain/normalize.py (P2).
#
# STYLE SETTING (D6):
#   style: native  = use words from this file
#   style: english = use English number words (num2words)
#   style: digits  = read digits one by one
#
# TODO (event H0-1 listening test):
#   Play 3 TTS audio samples per language, one per style.
#   Pick style that sounds most natural. Update style: below.
#   This takes ~20 min. Do it right after smoke_tts.py.
#
# TODO: Native speaker must verify hi and kn word lists before use.
#       Focus on: numbers above 20, month names, weight phrasing.

